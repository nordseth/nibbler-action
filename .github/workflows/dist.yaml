on:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: './package-lock.json'

      - name: Install dependencies
        run: npm install
      - name: Build
        run: npm run build
      - name: Guard against broken bundle
        run: |
          for f in dist/index.js dist/login/index.js dist/metadata/index.js; do
            if [ ! -s "$f" ]; then
              echo "::error::expected bundle missing or empty: $f"; exit 1
            fi
          done
          set +e
          matches=$(grep -rEl "webpackMissingModule|Cannot find module '@actions" dist)
          rc=$?
          set -e
          if [ "$rc" -eq 0 ]; then
            echo "::error::dist bundle contains unresolved-module markers:"; echo "$matches"; exit 1
          elif [ "$rc" -ge 2 ]; then
            echo "::error::guard grep failed with exit status $rc"; exit 1
          fi
      - name: GIT commit and push all changed files
        env: 
          CI_COMMIT_MESSAGE: Continuous Integration Build Artifacts
          CI_COMMIT_AUTHOR: github-actions[bot]
          CI_COMMIT_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          git add dist

          if [ -n "$(git diff --staged)" ]; then
            git config --global user.name "${{ env.CI_COMMIT_AUTHOR }}"
            git config --global user.email "${{ env.CI_COMMIT_EMAIL }}"
            git commit -m "build ${{ env.CI_COMMIT_MESSAGE }}"
            git push
          else
            echo "Working tree clean. Nothing to commit.";
          fi
    